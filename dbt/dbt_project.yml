name: retail_analytics
version: 1.0.0
config-version: 2

profile: retail_analytics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

require-dbt-version: [">=1.9.0", "<2.0.0"]

vars:
  # Orders in these statuses count toward realised revenue / delivered KPIs.
  revenue_order_statuses: ["delivered", "shipped", "invoiced"]
  # dim_date span — covers the dataset with headroom.
  date_start: "2016-01-01"
  date_end: "2019-12-31"

models:
  retail_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      core:
        +materialized: table
        +schema: marts
      metrics:
        +materialized: view
        +schema: metrics

# The Olist product-category PT->EN lookup ships inside the dataset, so it is
# loaded to raw.product_category_name_translation by scripts/load_raw.py and
# consumed as a source — not duplicated as a dbt seed.

# query-comment adds run metadata to every warehouse query (visible in
# Snowflake QUERY_HISTORY; harmless on DuckDB).
query-comment:
  comment: "dbt {{ dbt_version }} | {{ node.unique_id if node else 'no-node' }}"
  append: true
